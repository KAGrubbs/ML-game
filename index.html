<!doctype html>
<html>
  <head>
    <title>AI Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <div id="game-container">
      <div id="canvas-wrapper">
        <canvas id="game"></canvas>
      </div>
      <div id="center-div">
        <h1 class="orbitron-900">Start Game</h1>
        <div id="input-div">
          <input
            id="model-input"
            type="text"
            placeholder="Paste your Teachable Machine sharable link here"
          />
          <button id="load-model">Load Model ►</button>
        </div>
        <p id="status"></p>
      </div>
      <p id="action-text">Detected action: <strong id="action">idle</strong></p>
    </div>
    <!-- TensorFlow and Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>

    <script src="game.js"></script>
  </body>
</html>
